services:
  # ---- SQL Server database ----
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salesapp-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"            # optional: connect from host with SSMS/Azure Data Studio
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- .NET backend API ----
  backend:
    build:
      context: ./backend/SalesApp.Api
      dockerfile: Dockerfile
    container_name: salesapp-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=SalesAppDb;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Override the JWT secret with your own long random value
      Jwt__Key: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123456"
    ports:
      - "8080:8080"            # optional: hit the API/Swagger directly at http://localhost:8080/swagger
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ---- Angular frontend (nginx) ----
  frontend:
    build:
      context: ./frontend/sales-app
      dockerfile: Dockerfile
    container_name: salesapp-frontend
    ports:
      - "80:80"               # app served at http://192.168.1.26 (port 80)
    depends_on:
      - backend

volumes:
  mssql-data:
