<mat-toolbar color="primary" class="topbar">
  <button mat-icon-button (click)="toggle()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="brand">Sales Application</span>
  <span class="spacer"></span>
  <button mat-button [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
    <span class="username">{{ user()?.fullName }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/profile"><mat-icon>person</mat-icon><span>Profile</span></button>
    <button mat-menu-item routerLink="/change-password"><mat-icon>lock</mat-icon><span>Change Password</span></button>
    <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon><span>Logout</span></button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav [opened]="opened()" mode="side" class="sidenav">
    <mat-nav-list>
      @for (item of nav; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
