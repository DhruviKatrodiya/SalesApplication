<div class="page">
  <div class="page-header">
    <h1>Inventory / Stock</h1>
    <button mat-flat-button color="primary" (click)="add()"><mat-icon>add</mat-icon> Add Item</button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="row" style="margin-bottom:12px">
        <mat-form-field appearance="fill" style="flex:1; min-width:240px">
          <mat-label>Search items</mat-label>
          <input matInput [ngModel]="filter()" (ngModelChange)="setFilter($event)" placeholder="name, SKU, category" />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
        <mat-checkbox [ngModel]="lowOnly()" (ngModelChange)="setLowOnly($event)">Low stock only (&le; 10)</mat-checkbox>
      </div>

      <table mat-table [dataSource]="pager.paged()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Item</th>
          <td mat-cell *matCellDef="let i">{{ i.name }}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let i">{{ i.categoryName }} / {{ i.subCategoryName }}</td>
        </ng-container>
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef>SKU</th>
          <td mat-cell *matCellDef="let i">{{ i.sku }}</td>
        </ng-container>
        <ng-container matColumnDef="unit">
          <th mat-header-cell *matHeaderCellDef>Unit</th>
          <td mat-cell *matCellDef="let i">{{ i.unit }}</td>
        </ng-container>
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let i">
            <span class="chip" [class.chip-low]="i.stockQuantity <= 10" [class.chip-ok]="i.stockQuantity > 10">
              {{ i.stockQuantity }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Unit Price</th>
          <td mat-cell *matCellDef="let i">{{ i.unitPrice | currency:'INR' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let i">
            <button mat-icon-button (click)="edit(i)"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="remove(i)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      @if (!filtered().length) { <div class="empty">No items found.</div> }
      <mat-paginator [length]="pager.total()" [pageSize]="pager.pageSize()" [pageIndex]="pager.pageIndex()"
        [pageSizeOptions]="pageSizeOptions" (page)="pager.onPage($event)" showFirstLastButtons />
    </mat-card-content>
  </mat-card>
</div>
