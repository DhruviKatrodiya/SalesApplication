<mat-card class="auth-card">
  @if (loading()) { <mat-progress-bar mode="indeterminate" /> }
  <mat-card-content>
    <div class="brand-row">
      <mat-icon color="primary">lock_reset</mat-icon>
      <h1 class="auth-title">Forgot Password</h1>
    </div>
    <p class="auth-subtitle">Enter your email to receive an OTP code</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="fill" class="full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" required />
        <mat-icon matSuffix>email</mat-icon>
        @if (form.controls.email.hasError('required')) { <mat-error>Email is required</mat-error> }
        @if (form.controls.email.hasError('email')) { <mat-error>Enter a valid email</mat-error> }
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Send OTP</button>
      </div>
    </form>

    <div class="links">
      <a routerLink="/login">Back to login</a>
    </div>
  </mat-card-content>
</mat-card>
