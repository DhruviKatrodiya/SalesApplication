<div class="page">
  <div class="page-header">
    <h1>Routes</h1>
    <button mat-flat-button color="primary" (click)="add()"><mat-icon>add</mat-icon> Add Route</button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <mat-form-field appearance="fill" class="full" subscriptSizing="dynamic" style="margin-bottom:28px">
        <mat-label>Search routes</mat-label>
        <input matInput [ngModel]="search()" (ngModelChange)="setSearch($event)" placeholder="route name" />
        @if (search()) {
          <button mat-icon-button matSuffix aria-label="Clear" (click)="setSearch('')"><mat-icon>close</mat-icon></button>
        } @else {
          <mat-icon matSuffix>search</mat-icon>
        }
      </mat-form-field>

      <table mat-table [dataSource]="routes()">
        <ng-container matColumnDef="srNo">
          <th mat-header-cell *matHeaderCellDef>Sr. No.</th>
          <td mat-cell *matCellDef="let row; let i = index">{{ pager.pageIndex() * pager.pageSize() + i + 1 }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let r">{{ r.name }}</td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let r">{{ r.description }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button (click)="edit(r)"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="remove(r)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      @if (!routes().length) {
        @if (search()) {
          <div class="empty">No routes match "{{ search() }}".</div>
        } @else {
          <div class="empty">No routes yet. Click "Add Route".</div>
        }
      }
      <mat-paginator [length]="pager.total()" [pageSize]="pager.pageSize()" [pageIndex]="pager.pageIndex()"
        [pageSizeOptions]="pageSizeOptions" (page)="pager.onPage($event)" showFirstLastButtons />
    </mat-card-content>
  </mat-card>
</div>
